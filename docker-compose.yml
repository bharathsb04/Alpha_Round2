version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: humantwin-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: humantwin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: humantwin-backend
    restart: always
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgrespassword@db:5432/humantwin"
      SECRET_KEY: "humantwin_docker_jwt_super_secret_key"
      AI_PROVIDER: "local"
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: humantwin-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
